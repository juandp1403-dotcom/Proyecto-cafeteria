services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "5545"
    env_file:
      - path: ../.env
        required: false
    networks:
      - coolify
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5545/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  coolify:
    external: true
