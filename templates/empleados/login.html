{% extends "base.html" %}
{% block title %}Acceso Personal – Cafetería SENA{% endblock %}

{% block extra_css %}
<style>
  .crown-circle {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 3px solid #FFD700;
    background: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
    color: #FFD700;
    margin: 0 auto 12px;
    box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
  }
</style>
{% endblock %}

{% block body %}
<div class="min-vh-100 d-flex align-items-center justify-content-center px-3" style="background:var(--bg-main)">
  <div class="card" style="width:100%;max-width:400px">
    <div class="card-header-sena text-center">
      <div class="crown-circle">
        <i class="bi bi-crown-fill"></i>
      </div>
      <h5 class="mb-0">Acceso Personal</h5>
      <small class="opacity-75">Cafetería CGAO – Admin y Empleados</small>
    </div>
    <div class="card-body p-4">
      <form method="POST" action="{{ url_for('empleados.login') }}" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold">
            <i class="bi bi-envelope me-1" style="color:var(--sena-green)"></i>Correo electrónico
          </label>
          <input type="email" class="form-control" name="email" required autofocus
                 placeholder="tu@correo.com">
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">
            <i class="bi bi-key me-1" style="color:var(--sena-green)"></i>Contraseña
          </label>
          <div class="input-group">
            <input type="password" class="form-control" name="clave" id="campoPass" required>
            <button class="btn btn-outline-secondary" type="button" onclick="togglePass()">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-sena w-100">
          <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="{{ url_for('cliente.registro') }}" class="text-muted small">
          <i class="bi bi-arrow-left me-1"></i>Volver al registro de cliente
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePass() {
  const campo = document.getElementById('campoPass');
  const icon  = document.getElementById('eyeIcon');
  if (campo.type === 'password') {
    campo.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    campo.type = 'password';
    icon.className = 'bi bi-eye';
  }
}
</script>
{% endblock %}
