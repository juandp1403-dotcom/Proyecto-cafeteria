# Configuracion minima: detectar errores reales (sintaxis, nombres
# indefinidos, imports rotos), no exigir un estilo completo sobre un
# proyecto que nunca tuvo linter. Se puede ampliar mas adelante.
line-length = 120

[lint]
select = ["E9", "F"]
ignore = [
    "F401",  # imports sin usar -- ya hay varios conocidos, se limpian aparte (ver auditoria)
]
